name: Update lessons

# Rebuilds the courses (npm run content:import) whenever a merge to main
# changes how lessons are made, so the live lessons always match the code.
# Learners keep their progress (scripts/content/keep-progress.ts).
#
# The schema is pushed first, as in db-push.yml: new lessons may need new
# columns. Both share one concurrency group, so they never run at once.
#
# Requires the repository secret DATABASE_URL (Settings → Secrets and
# variables → Actions).

on:
  push:
    branches:
      - main
    paths:
      - "scripts/import-content.ts"
      - "scripts/content/**"
      - "content/references/**"
      # The content scripts import these.
      - "db/schema.ts"
      - "lib/arabic.ts"
      - "lib/exercises.ts"
  workflow_dispatch:

concurrency:
  group: db-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import-content:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies (from bun.lock)
        run: bun install --frozen-lockfile

      - name: Check the DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Push schema to the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit push

      - name: Rebuild the courses
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run content:import
